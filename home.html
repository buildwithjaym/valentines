<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hi Bb 💗</title>
  <link rel="stylesheet" href="home.css"/>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="noise"></div>
  </div>

  <main class="wrap">
    <header class="hero">
      <div class="mark">💗</div>
      <h1>Hi Bb.</h1>
      <p class="sub">Before you enter… can we do a tiny cute check? 🥺💙</p>
      <button class="primary" id="startQuiz">Start</button>
    </header>

    <section class="home-card">
      <h2>What’s inside</h2>
      <ul>
        <li>Assurance</li>
        <li>Words of encouragement</li>
        <li>Our future</li>
        <li>And a last surprise 🌷</li>
      </ul>
      <p class="micro">P.S. This is made only for you.</p>
    </section>
  </main>

  
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-card" role="document">
      <button class="close" id="close" aria-label="Close">✕</button>

      <div class="modal-top">
        <div class="pill" id="stepPill">Question 1/4</div>
        <h2 id="qTitle">Question</h2>
        <p class="qText" id="qText"></p>
      </div>

      <div class="answer" id="answerArea">
        
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="modal-actions">
        <button class="chip" id="backBtn" disabled>Back</button>
        <button class="primary" id="nextBtn">Next</button>
      </div>
    </div>

    <div class="modal-backdrop" id="backdrop"></div>
  </div>

  <div id="confettiHost" aria-hidden="true"></div>

  <script src="home.js"></script>
</body>
</html>
